<text x="640" y="58" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="800">Test framework vs. Tashev Proof</text>
<text x="640" y="90" text-anchor="middle" fill="#a1a1aa" font-size="17" font-family="Arial,sans-serif">Different layers, designed to work together.</text>
