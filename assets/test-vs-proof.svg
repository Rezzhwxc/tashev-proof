 <text x="125" y="222" fill="#fff" font-size="18">Question:</text><text x="220" y="222" fill="#d4d4d8" font-size="18">“Did this test pass?”</text>
 <text x="125" y="262" fill="#a1a1aa" font-size="15">Jest · pytest · Playwright · Cypress · Go test</text>
 <text x="125" y="298" fill="#a1a1aa" font-size="15">Excellent at executing specific technical assertions.</text>
 <rect x="720" y="135" width="470" height="210" rx="24" fill="#052e16" stroke="#22c55e"/>
