<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
<rect width="1280" height="360" rx="28" fill="#0c0c0f"/>
<text x="64" y="58" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="700">From a vague “done” to verifiable evidence</text>
<text x="64" y="90" fill="#a1a1aa" font-size="18" font-family="Arial,sans-serif">Proof evaluates the original task, not whether the AI sounds confident.</text>
<g font-family="Arial,sans-serif">
 <rect x="55" y="145" width="210" height="110" rx="20" fill="#18181b" stroke="#3f3f46"/>
 <text x="160" y="184" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">1. Human task</text>
 <text x="160" y="217" text-anchor="middle" fill="#a1a1aa" font-size="15">“Add password reset”</text>
 <path d="M282 200h67" stroke="#22c55e" stroke-width="5"/><path d="m345 190 18 10-18 10" fill="#22c55e"/>
 <rect x="375" y="145" width="220" height="110" rx="20" fill="#18181b" stroke="#3f3f46"/>
 <text x="485" y="184" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">2. Proof contract</text>
 <text x="485" y="217" text-anchor="middle" fill="#a1a1aa" font-size="15">what “done” means</text>
 <path d="M612 200h67" stroke="#22c55e" stroke-width="5"/><path d="m675 190 18 10-18 10" fill="#22c55e"/>
 <rect x="705" y="145" width="220" height="110" rx="20" fill="#18181b" stroke="#3f3f46"/>
 <text x="815" y="184" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">3. Evidence</text>
 <text x="815" y="217" text-anchor="middle" fill="#a1a1aa" font-size="15">tests · files · HTTP · human</text>
 <path d="M942 200h67" stroke="#22c55e" stroke-width="5"/><path d="m1005 190 18 10-18 10" fill="#22c55e"/>
 <rect x="1035" y="145" width="190" height="110" rx="20" fill="#052e16" stroke="#22c55e"/>
 <text x="1130" y="184" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="700">4. Verdict</text>
 <text x="1130" y="217" text-anchor="middle" fill="#fff" font-size="15">PROVEN / PARTIAL / FAILED</text>
</g>
</svg>