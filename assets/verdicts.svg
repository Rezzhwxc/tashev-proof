<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390">
<rect width="1280" height="390" rx="30" fill="#09090b"/>
<text x="640" y="58" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="800">Three honest outcomes</text>
<text x="640" y="90" text-anchor="middle" fill="#a1a1aa" font-size="17" font-family="Arial,sans-serif">Proof never turns “unknown” into “pass”.</text>
<g font-family="Arial,sans-serif">
 <rect x="70" y="135" width="340" height="190" rx="24" fill="#052e16" stroke="#22c55e"/><circle cx="115" cy="182" r="22" fill="#166534"/><path d="M104 183l8 8 15-18" fill="none" stroke="#bbf7d0" stroke-width="6" stroke-linecap="round"/><text x="155" y="190" fill="#86efac" font-size="24" font-weight="800">PROVEN</text><text x="105" y="235" fill="#fff" font-size="16">Every required criterion has evidence.</text><text x="105" y="270" fill="#bbf7d0" font-size="15">Exit: success · Ready to ship</text>
 <rect x="470" y="135" width="340" height="190" rx="24" fill="#422006" stroke="#ca8a04"/><circle cx="515" cy="182" r="22" fill="#713f12"/><text x="515" y="190" text-anchor="middle" fill="#fde68a" font-size="24" font-weight="800">?</text><text x="555" y="190" fill="#fde68a" font-size="24" font-weight="800">PARTIAL</text><text x="505" y="235" fill="#fff" font-size="16">Nothing failed, but evidence is missing.</text><text x="505" y="270" fill="#fde68a" font-size="15">Do not silently assume success</text>
 <rect x="870" y="135" width="340" height="190" rx="24" fill="#450a0a" stroke="#dc2626"/><circle cx="915" cy="182" r="22" fill="#7f1d1d"/><path d="M906 173l18 18M924 173l-18 18" stroke="#fecaca" stroke-width="5" stroke-linecap="round"/><text x="955" y="190" fill="#fca5a5" font-size="24" font-weight="800">FAILED</text><text x="905" y="235" fill="#fff" font-size="16">At least one required criterion failed.</text><text x="905" y="270" fill="#fecaca" font-size="15">Exit: blocked · Do not ship</text>
</g>
</svg>