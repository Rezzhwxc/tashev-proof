<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
<rect width="1280" height="500" rx="30" fill="#09090b"/>
<text x="64" y="58" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="800">60-second workflow</text>
<text x="64" y="90" fill="#a1a1aa" font-size="17" font-family="Arial,sans-serif">Create a contract, run evidence, attest what only a human can verify, then ship.</text>
<g transform="translate(75 125)" font-family="ui-monospace,Menlo,monospace">
 <rect width="1130" height="315" rx="24" fill="#030303" stroke="#27272a"/>
 <rect width="1130" height="46" rx="24" fill="#18181b"/><circle cx="25" cy="23" r="5" fill="#ef4444"/><circle cx="45" cy="23" r="5" fill="#eab308"/><circle cx="65" cy="23" r="5" fill="#22c55e"/>
 <text x="28" y="88" fill="#71717a" font-size="15"># 1 — define the task</text>
 <text x="28" y="119" fill="#4ade80" font-size="18">$ proof init --task "Add password reset"</text>
 <text x="28" y="158" fill="#71717a" font-size="15"># 2 — run independent evidence</text>
 <text x="28" y="189" fill="#4ade80" font-size="18">$ proof run</text>
 <text x="28" y="228" fill="#71717a" font-size="15"># 3 — add explicit human evidence where needed</text>
 <text x="28" y="259" fill="#4ade80" font-size="18">$ proof attest mobile-ux --note "Checked on iPhone"</text>
 <text x="28" y="298" fill="#71717a" font-size="15"># 4 — release gate</text>
 <text x="28" y="329" fill="#4ade80" font-size="18">$ proof ship</text>
 <rect x="810" y="255" width="265" height="42" rx="12" fill="#052e16" stroke="#166534"/><text x="942" y="282" text-anchor="middle" fill="#86efac" font-size="16" font-weight="700">STATUS: PROVEN ✓</text>
</g>
</svg>