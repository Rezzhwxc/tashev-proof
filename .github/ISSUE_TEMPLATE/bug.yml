name: Bug report
description: Report reproducible Tashev Proof behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never paste real credentials or private project evidence.
  - type: input
    id: version
    attributes:
      label: Proof version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Minimal safe contract / criterion
      description: Remove private data before posting.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
    validations:
      required: true
